name: Update engineering activity

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 12:17 UTC
    - cron: "17 12 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update activity metrics
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: python scripts/activity.py --write

      - name: Commit updated metrics
        run: |
          if git diff --quiet; then
            echo "Activity metrics have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: update engineering activity"
          git push